mode: ContinuousDeployment
branches:
  main:
    regex: ^main$
    mode: ContinuousDeployment
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: true
    track-merge-target: false
    is-release-branch: true
  feature:
    regex: ^feature[/-]
    mode: ContinuousDeployment
    label: alpha
    increment: Inherit
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDeployment
    label: PullRequest
    increment: Inherit
  hotfix:
    regex: ^hotfix[/-]
    mode: ContinuousDeployment
    label: beta
    increment: Patch
  release:
    regex: ^release[/-]
    mode: ContinuousDeployment
    label: rc
    increment: None
    is-release-branch: true
ignore:
  sha: []
